<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Check your email · SkillDojo</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="min-h-full bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased">
<div class="mx-auto max-w-md px-4 py-8 sm:py-12">
  <main id="main-content" tabindex="-1" class="rounded-2xl bg-white dark:bg-slate-900 p-6 sm:p-8 shadow-sm border border-slate-200 dark:border-slate-800 space-y-4">
    <h1 class="text-2xl font-bold tracking-tight">Check your email</h1>
    <p>If <strong>{{.Email}}</strong> can receive mail, a sign-in link is on its way. It works once and expires in 15 minutes.</p>
    {{if .DevLink}}<p class="rounded-lg bg-amber-50 px-3 py-2 text-sm dark:bg-amber-950">Development mode: <a class="underline" href="{{.DevLink}}">open the sign-in link</a>.</p>{{end}}
    <p class="text-sm text-slate-600 dark:text-slate-400"><a class="underline" href="/login">Use a different address</a> · <a class="underline" href="/">Back to practice</a></p>
  </main>
</div>
</body>
</html>

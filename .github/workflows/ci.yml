name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go vet ./...
      - run: go test ./...
      - run: go build -o skilldojo .
      # Verify the committed CSS is in sync with input.css and the templates.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: ./node_modules/.bin/tailwindcss -i input.css -o static/app.css --minify
      - run: git diff --exit-code static/app.css
